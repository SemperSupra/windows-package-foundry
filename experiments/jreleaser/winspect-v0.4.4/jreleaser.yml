project:
  name: WinInspect
  version: 0.4.4
  description: Window inspection and automation for Windows and Wine.
  longDescription: Window inspection and automation tool for Windows and Wine.
  authors:
    - Mark E. DeYoung
  license: PolyForm-Noncommercial-1.0.0
  copyright: 2026 Mark E. DeYoung
  stereotype: DESKTOP
  vendor: SemperSupra
  tags:
    - windows
    - automation
    - inspection
  links:
    homepage: https://github.com/SemperSupra/WinInspect
    documentation: https://github.com/SemperSupra/WinInspect/tree/b2d07ae3ff1df53a62c27ec3fa27f1452ff5926a
    license: https://github.com/SemperSupra/WinInspect/blob/b2d07ae3ff1df53a62c27ec3fa27f1452ff5926a/LICENSE
    bugTracker: https://github.com/SemperSupra/WinInspect/issues
    vcsBrowser: https://github.com/SemperSupra/WinInspect

release:
  github:
    owner: SemperSupra
    name: WinInspect
    tagName: v0.4.4
    skipTag: true
    skipRelease: true
    uploadAssets: NEVER

packagers:
  scoop:
    active: NEVER
  winget:
    active: NEVER
  chocolatey:
    active: NEVER

distributions:
  wininspect-portable:
    type: BINARY
    stereotype: CLI
    tags:
      - windows
      - cli
      - automation
      - inspection
    executable:
      name: wininspect
      windowsExtension: exe
    artifacts:
      - path: inputs/WinInspectPortable-v0.4.4.zip
        platform: windows-x86_64
    scoop:
      active: ALWAYS
      skipPublishing: true
      downloadUrl: https://github.com/SemperSupra/WinInspect/releases/download/v0.4.4/{{artifactFile}}
      packageName: wininspect
      repository:
        active: NEVER
      extraProperties:
        skipLicenseFile: true
    winget:
      active: ALWAYS
      skipPublishing: true
      downloadUrl: https://github.com/SemperSupra/WinInspect/releases/download/v0.4.4/{{artifactFile}}
      repository:
        active: NEVER
      defaultLocale: en-US
      author: Mark E. DeYoung
      moniker: wininspect
      minimumOsVersion: 10.0.0.0
      package:
        identifier: SemperSupra.WinInspect
        name: WinInspect
        version: 0.4.4
        url: https://github.com/SemperSupra/WinInspect
      publisher:
        name: Mark E. DeYoung
        url: https://github.com/SemperSupra
        supportUrl: https://github.com/SemperSupra/WinInspect/issues
      installer:
        type: ZIP
        scope: USER
        modes:
          - SILENT
        upgradeBehavior: INSTALL
        command: wininspect
      extraProperties:
        skipLicenseFile: true
    chocolatey:
      active: NEVER

  wininspect-installer:
    type: NATIVE_PACKAGE
    stereotype: DESKTOP
    tags:
      - windows
      - desktop
      - automation
      - inspection
    executable:
      name: wininspect
      windowsExtension: exe
    artifacts:
      - path: inputs/WinInspect-Installer-v0.4.4.exe
        platform: windows-x86_64
    chocolatey:
      active: ALWAYS
      skipPublishing: true
      downloadUrl: https://github.com/SemperSupra/WinInspect/releases/download/v0.4.4/{{artifactFile}}
      packageName: wininspect
      packageVersion: 0.4.4
      remoteBuild: true
      title: WinInspect
      repository:
        active: NEVER
      extraProperties:
        skipLicenseFile: true
        foundryManagedInstallerArgs: /S /MANAGED-BY=chocolatey
    scoop:
      active: NEVER
    winget:
      active: NEVER
