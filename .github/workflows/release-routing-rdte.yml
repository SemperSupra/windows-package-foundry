name: Release routing RDTE

on:
  pull_request:
    paths:
      - '.github/workflows/release-routing-rdte.yml'
      - 'experiments/release-routing/**'
      - 'experiments/jreleaser/agentkvm2usb-v0.2.0/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Generate deterministic plans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plans"
          python experiments/release-routing/planner.py experiments/release-routing/agentkvm2usb-v0.2.0.json "$RUNNER_TEMP/plans/agentkvm2usb-plan.json"
          python experiments/release-routing/planner.py experiments/release-routing/oxce-mod-studio.json "$RUNNER_TEMP/plans/oxce-plan.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'plans'
          a=json.loads((p/'agentkvm2usb-plan.json').read_text()); o=json.loads((p/'oxce-plan.json').read_text())
          assert a['projectionBackend']=='jreleaser' and a['publicationAuthorized'] is False
          assert set(a['venues'])=={'scoop-local','winget-local','chocolatey-local'}
          assert a['venues']['scoop-local']['eligible'] is True
          assert a['venues']['chocolatey-local']['eligible'] is True
          assert a['venues']['winget-local']['eligible'] is False
          assert 'venue.winget.nested-portable-cmd-rejected-by-native-validator' in a['venues']['winget-local']['reasonCodes']
          assert o['projectionBackend'] is None and o['venues']['vscode']['adapter']=='venue-native'
          assert o['venues']['vscode']['eligible'] is True
          assert 'venue.native-packaging-authoritative' in o['reasonCodes'] and o['publicationAuthorized'] is False
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: release-routing-plans, path: '${{ runner.temp }}/plans', if-no-files-found: error, retention-days: 30}

  agentkvm2usb-generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {JRELEASER_GITHUB_TOKEN: RDTE-NO-PUBLISH-NOT-A-CREDENTIAL}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Run bounded JReleaser projection
        shell: bash
        run: |
          set -euo pipefail
          EXP="$GITHUB_WORKSPACE/experiments/jreleaser/agentkvm2usb-v0.2.0"; WORK="$RUNNER_TEMP/agentkvm2usb-rdte"
          JR_VERSION='1.25.0'; JR_SHA256='7c086a384e509ae30ad12ce2f10946601c0798e746d06a5538afc267e398644b'; ART_SHA256='360ff91a7c4b76d90b5d115ceea379b4f8c8568e67c54c36f7c37a8ff413a3c1'
          rm -rf "$WORK" "$EXP/inputs"; mkdir -p "$WORK/tool" "$WORK/run1" "$WORK/run2" "$WORK/result" "$EXP/inputs"
          curl -fsSL -o "$WORK/jreleaser.zip" "https://github.com/jreleaser/jreleaser/releases/download/v${JR_VERSION}/jreleaser-${JR_VERSION}.zip"
          echo "${JR_SHA256}  $WORK/jreleaser.zip" | sha256sum -c --strict; unzip -q "$WORK/jreleaser.zip" -d "$WORK/tool"
          JR="$WORK/tool/jreleaser-${JR_VERSION}/bin/jreleaser"; chmod +x "$JR"
          curl -fsSL -o "$EXP/inputs/AgentKVM2USB-v0.2.0-windows-portable.zip" 'https://github.com/SemperSupra/AgentKVM2USB/releases/download/v0.2.0/AgentKVM2USB-v0.2.0-windows-portable.zip'
          echo "${ART_SHA256}  $EXP/inputs/AgentKVM2USB-v0.2.0-windows-portable.zip" | sha256sum -c --strict
          run_jr(){ local op="$1" out="$2"; case "$op" in config|prepare|package);;*) exit 70;;esac; args=("$op" --config-file "$EXP/jreleaser.yml" --output-directory "$out" --strict --reproducible --git-root-search); [[ "$op" == package ]] && args+=(--dry-run); "$JR" "${args[@]}"; }
          for out in "$WORK/run1" "$WORK/run2"; do run_jr config "$out"; run_jr prepare "$out"; run_jr package "$out"; done
          inventory(){ (cd "$1" && find jreleaser -type f \( -path '*/prepared/*' -o -path '*/package/*' \) -print0 | sort -z | xargs -0 sha256sum); }
          inventory "$WORK/run1" > "$WORK/result/run1.sha256"; inventory "$WORK/run2" > "$WORK/result/run2.sha256"
          if diff -u "$WORK/result/run1.sha256" "$WORK/result/run2.sha256" > "$WORK/result/repro.diff"; then echo stable=true > "$WORK/result/repro.txt"; else echo stable=false > "$WORK/result/repro.txt"; fi
          cp -a "$WORK/run1/jreleaser" "$WORK/result/run1-jreleaser"
          printf '%s\n' 'productSpecificProceduralGeneratorLines=0' 'genericSemanticAdapter=portable-zip-normalizer' 'publication=not-invoked' 'promotion=not-promoted' 'crossDayReproducibility=not-proven-by-single-run' > "$WORK/result/metrics.txt"
          rm -rf "$EXP/inputs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: agentkvm2usb-jreleaser-rdte, path: '${{ runner.temp }}/agentkvm2usb-rdte/result', if-no-files-found: error, retention-days: 30}

  agentkvm2usb-windows:
    needs: agentkvm2usb-generate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: agentkvm2usb-jreleaser-rdte, path: '${{ runner.temp }}\agent-input'}
      - name: Native validation and portable lifecycle
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference='Stop'
          $pkg=Join-Path $env:RUNNER_TEMP 'agent-input\run1-jreleaser\package'; $out=Join-Path $env:RUNNER_TEMP 'agent-native'; New-Item -ItemType Directory -Force $out | Out-Null
          $scoop=Get-ChildItem $pkg -Recurse -Filter 'agentkvm2usb.json' | Select-Object -First 1
          $installer=Get-ChildItem $pkg -Recurse -Filter 'SemperSupra.AgentKVM2USB.installer.yaml' | Select-Object -First 1
          $version=Get-ChildItem $pkg -Recurse -Filter 'SemperSupra.AgentKVM2USB.yaml' | Select-Object -First 1
          $nuspec=Get-ChildItem $pkg -Recurse -Filter '*.nuspec' | Select-Object -First 1
          if (-not $scoop -or -not $installer -or -not $version -or -not $nuspec) { throw 'required JReleaser output missing' }
          python experiments/release-routing/normalize_portable_zip.py experiments/release-routing/agentkvm2usb-v0.2.0.json $scoop.FullName $installer.FullName
          $scoopObj=Get-Content $scoop.FullName -Raw | ConvertFrom-Json
          if ($scoopObj.bin[0][0] -ne 'Run-AgentKVM2USB.cmd' -or $scoopObj.bin[0][1] -ne 'AgentKVM2USB') { throw 'Scoop semantic normalization failed' }
          [xml](Get-Content $nuspec.FullName -Raw) | Out-Null
          $choco=Get-Command choco.exe -ErrorAction Stop; & $choco.Source pack $nuspec.FullName --output-directory $out --limit-output; if ($LASTEXITCODE -ne 0) { throw "choco pack failed: $LASTEXITCODE" }
          $winget=Get-Command winget.exe -ErrorAction SilentlyContinue
          $wingetStatus='runner-unavailable'
          if ($winget) {
            $manifestRoot=Split-Path -Parent $version.FullName
            $wingetOutput = (& $winget.Source validate --manifest $manifestRoot --disable-interactivity 2>&1 | Out-String)
            $wingetExit=$LASTEXITCODE
            $wingetOutput | Set-Content (Join-Path $out 'winget-validation.txt') -Encoding utf8NoBOM
            if ($wingetExit -eq 0) {
              throw 'WinGet unexpectedly accepted the known-ineligible .cmd nested portable entrypoint; capability evidence changed and requires review'
            }
            if ($wingetOutput -notmatch 'file type of the referenced file is not allowed' -or $wingetOutput -notmatch 'Run-AgentKVM2USB\.cmd') {
              throw "WinGet failed for an unexpected reason: $wingetOutput"
            }
            $wingetStatus='ineligible-native-validator-rejects-cmd-entrypoint'
          }
          $zip=Join-Path $out 'AgentKVM2USB.zip'; Invoke-WebRequest -UseBasicParsing 'https://github.com/SemperSupra/AgentKVM2USB/releases/download/v0.2.0/AgentKVM2USB-v0.2.0-windows-portable.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '360ff91a7c4b76d90b5d115ceea379b4f8c8568e67c54c36f7c37a8ff413a3c1') { throw 'fixture hash mismatch' }
          $install=Join-Path $out 'install'; Expand-Archive $zip $install; $run=Get-ChildItem $install -Recurse -Filter 'Run-AgentKVM2USB.cmd' | Select-Object -First 1; $bootstrap=Get-ChildItem $install -Recurse -Filter 'Install-Dependencies.cmd' | Select-Object -First 1; if (-not $run -or -not $bootstrap) { throw 'command/bootstrap missing' }
          $install2=Join-Path $out 'install-repeat'; Expand-Archive $zip $install2; if (-not (Get-ChildItem $install2 -Recurse -Filter 'Run-AgentKVM2USB.cmd' | Select-Object -First 1)) { throw 'repeat materialization failed' }
          Remove-Item $install -Recurse -Force; if (Test-Path $install) { throw 'owned-tree uninstall residue' }
          $e=[ordered]@{schemaVersion=1;status='rdte';authority='non-authoritative';genericSemanticAdapter='portable-zip-normalizer';productSpecificProceduralGeneratorLines=0;scoopSemanticNormalization='passed';wingetEligibility='ineligible';wingetReasonCode='venue.winget.nested-portable-cmd-rejected-by-native-validator';wingetValidate=$wingetStatus;chocolateyPack='passed';fixtureHash='passed';commandExposure='passed';dependencyBootstrapPresence='passed';dependencyBootstrapExecution='not-run-network-heavy-and-hardware-dependent';repeatMaterialization='passed';upgradeSimulation='same-version-repeat-only';uninstallOwnedTree='passed';hardwareValidation='out-of-scope';externalPublication='not-invoked'}
          $e | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'lifecycle.json') -Encoding utf8NoBOM
          Copy-Item $scoop.FullName (Join-Path $out 'agentkvm2usb.scoop.json'); Copy-Item (Split-Path -Parent $version.FullName) (Join-Path $out 'winget') -Recurse; Copy-Item (Split-Path -Parent $nuspec.FullName) (Join-Path $out 'chocolatey') -Recurse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: agentkvm2usb-native-rdte, path: '${{ runner.temp }}\agent-native', if-no-files-found: error, retention-days: 30}

  oxce-vsix:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: release-routing-plans, path: '${{ runner.temp }}\plans'}
      - name: Validate venue-native routing and VSIX
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference='Stop'; $plan=Get-Content (Join-Path $env:RUNNER_TEMP 'plans\oxce-plan.json') -Raw | ConvertFrom-Json
          if ($null -ne $plan.projectionBackend -or $plan.venues.vscode.adapter -ne 'venue-native' -or -not $plan.venues.vscode.eligible) { throw 'VSIX routing incorrect' }
          $out=Join-Path $env:RUNNER_TEMP 'oxce-vsix'; New-Item -ItemType Directory -Force $out | Out-Null; $vsix=Join-Path $out 'oxce-mod-studio.vsix'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/SemperSupra/oxce-mod-studio/releases/download/studio-exp-current/oxce-mod-studio-experimental-0.0.1-g3a3d4626.vsix' -OutFile $vsix
          if ((Get-FileHash $vsix -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2b4e0c2b285e37ab05bd09f3b905678da7c8826987a46785d133d759f78bd4ca') { throw 'VSIX hash mismatch' }
          $expanded=Join-Path $out 'expanded'; Expand-Archive -LiteralPath $vsix -DestinationPath $expanded; $pkg=Get-ChildItem $expanded -Recurse -Filter 'package.json' | Select-Object -First 1; if (-not $pkg) { throw 'package.json missing' }; $manifest=Get-Content $pkg.FullName -Raw | ConvertFrom-Json; if (-not $manifest.name -or -not $manifest.version -or -not $manifest.engines.vscode) { throw 'VSIX identity incomplete' }
          $code=Get-Command code.cmd -ErrorAction SilentlyContinue; $installStatus='runner-unavailable'; if ($code) { & $code.Source --install-extension $vsix --force; if ($LASTEXITCODE -ne 0) { throw 'VS Code install failed' }; $installStatus='passed'; & $code.Source --uninstall-extension ("{0}.{1}" -f $manifest.publisher,$manifest.name) | Out-Null }
          $e=[ordered]@{schemaVersion=1;status='rdte';authority='non-authoritative';projectionBackend=$null;adapter='venue-native';reasonCodes=$plan.reasonCodes;fixtureHash='passed';manifestParse='passed';name=$manifest.name;version=$manifest.version;engine=$manifest.engines.vscode;vscodeCliInstall=$installStatus;activation='not-run-in-foundry';marketplacePublication='not-invoked';productSpecificProceduralCoreLines=0}; $e | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'vsix-validation.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: oxce-vsix-routing-rdte, path: '${{ runner.temp }}\oxce-vsix', if-no-files-found: error, retention-days: 30}
