name: WinInspect MVP client lifecycle
run-name: ${{ github.event_name == 'workflow_dispatch' && format('sidecar:{0}:{1}:{2}', inputs.workset_id, inputs.delegation_id, inputs.assignment_id) || format('WinInspect MVP client lifecycle {0}', github.ref_name) }}

on:
  pull_request:
    paths:
      - '.github/workflows/winspect-mvp-client-lifecycle.yml'
      - 'scripts/Test-WinGetClientLifecycle.ps1'
      - 'scripts/Test-WinGetPortableLifecycle.ps1'
      - 'scripts/New-PublicPackageProjection.ps1'
      - 'tests/fixtures/public-package.json'
      - 'docs/client-interface-redteam.md'
      - 'scripts/Test-PublicFoundry.ps1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/winspect-mvp-client-lifecycle.yml'
      - 'scripts/Test-WinGetClientLifecycle.ps1'
      - 'scripts/Test-WinGetPortableLifecycle.ps1'
      - 'scripts/New-PublicPackageProjection.ps1'
      - 'tests/fixtures/public-package.json'
      - 'docs/client-interface-redteam.md'
      - 'scripts/Test-PublicFoundry.ps1'
  workflow_dispatch:
    inputs:
      assignment_id:
        description: Stable assignment/idempotency key; use manual outside Agent Dispatch
        required: false
        default: manual
        type: string
      workset_id:
        description: Correlation only; authoritative workset remains outside Actions
        required: false
        default: manual
        type: string
      delegation_id:
        description: Bounded workset delegation being executed
        required: false
        default: manual
        type: string

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate public Foundry structure and projection fixture
        shell: pwsh
        run: ./scripts/Test-PublicFoundry.ps1

      - name: Prove exact WinInspect v0.4.4 lifecycle through WinGet portable archive
        shell: pwsh
        run: |
          ./scripts/Test-WinGetPortableLifecycle.ps1 `
            -PortableUrl 'https://github.com/SemperSupra/WinInspect/releases/download/v0.4.4/WinInspectPortable-v0.4.4.zip' `
            -PortableSha256 '6ac0a65f774ffe69672f1c459254931ebfddb1e52c9fbec14b5db1348ccaad04' `
            -PackageIdentifier 'SemperSupra.WinInspect' `
            -PackageVersion '0.4.2' `
            -Publisher 'Mark E. DeYoung' `
            -PackageName 'WinInspect' `
            -License 'PolyForm-Noncommercial-1.0.0' `
            -Description 'Window inspection and automation tool for Windows and Wine.' `
            -EvidencePath '${{ github.workspace }}\wininspect-v0.4.4-client-lifecycle.json'

      - name: Diagnose NSIS-through-WinGet compatibility
        if: github.event_name == 'workflow_dispatch' && inputs.workset_id == 'manual'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/Test-WinGetClientLifecycle.ps1 `
            -InstallerUrl 'https://github.com/SemperSupra/WinInspect/releases/download/v0.4.4/WinInspect-Installer-v0.4.4.exe' `
            -InstallerSha256 '601d5f54083ea8922328b8b35d9094b8fb2eb8e8d243dd0883de90fb9919acba' `
            -PackageIdentifier 'SemperSupra.WinInspect' `
            -PackageVersion '0.4.2' `
            -Publisher 'Mark E. DeYoung' `
            -PackageName 'WinInspect' `
            -License 'PolyForm-Noncommercial-1.0.0' `
            -Description 'Window inspection and automation tool for Windows and Wine.' `
            -EvidencePath '${{ github.workspace }}\wininspect-v0.4.4-nsis-winget-lifecycle.json' `
            -FailureEvidencePath '${{ github.workspace }}\wininspect-v0.4.4-nsis-winget-timeout.json'

      - name: Upload lifecycle evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wininspect-v0.4.4-client-lifecycle
          path: wininspect-v0.4.4-client-lifecycle.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload optional NSIS diagnostic evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.workset_id == 'manual'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wininspect-v0.4.4-nsis-winget-diagnostics
          path: |
            wininspect-v0.4.4-nsis-winget-lifecycle.json
            wininspect-v0.4.4-nsis-winget-timeout.json
          if-no-files-found: warn
          retention-days: 30
