name: WinInspect native client readiness

on:
  pull_request:
    paths:
      - '.github/workflows/winspect-native-client-readiness.yml'
      - 'scripts/Test-ScoopClientLifecycle.ps1'
      - 'scripts/Test-ChocolateyClientLifecycle.ps1'
      - 'docs/client-interface-redteam.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/winspect-native-client-readiness.yml'
      - 'scripts/Test-ScoopClientLifecycle.ps1'
      - 'scripts/Test-ChocolateyClientLifecycle.ps1'
      - 'docs/client-interface-redteam.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prove exact WinInspect v0.4.2 Scoop lifecycle
        shell: pwsh
        run: |
          ./scripts/Test-ScoopClientLifecycle.ps1 `
            -PortableUrl 'https://github.com/SemperSupra/WinInspect/releases/download/v0.4.2/WinInspectPortable-v0.4.2.zip' `
            -PortableSha256 '34c6019b1ac59f284f5d88e6864e88de71043e36e5c61c0f78d052cd14790e0a' `
            -PackageId 'wininspect' `
            -PackageVersion '0.4.2' `
            -Bin @('App/WinInspect/winspect.exe','App/WinInspect/winspectd.exe','App/WinInspect/winspect-gui.exe') `
            -EvidencePath '${{ github.workspace }}\wininspect-v0.4.2-scoop-lifecycle.json'

      - name: Upload Scoop lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wininspect-v0.4.2-scoop-lifecycle
          path: wininspect-v0.4.2-scoop-lifecycle.json
          if-no-files-found: warn
          retention-days: 30

  chocolatey:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prove exact WinInspect v0.4.2 Chocolatey local-feed lifecycle
        shell: pwsh
        run: |
          ./scripts/Test-ChocolateyClientLifecycle.ps1 `
            -InstallerUrl 'https://github.com/SemperSupra/WinInspect/releases/download/v0.4.2/WinInspect-Installer-v0.4.2.exe' `
            -InstallerSha256 '77d05af906737bfd259c65901636e9e8cd0ea659d0f48c069189d7492e606809' `
            -PackageId 'wininspect' `
            -PackageVersion '0.4.2' `
            -EvidencePath '${{ github.workspace }}\wininspect-v0.4.2-chocolatey-lifecycle.json'

      - name: Upload Chocolatey lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wininspect-v0.4.2-chocolatey-lifecycle
          path: wininspect-v0.4.2-chocolatey-lifecycle.json
          if-no-files-found: warn
          retention-days: 30
